spring.application.name=b2b-platform
spring.datasource.url=${B2BWEB_DB_URL}
spring.datasource.username=${B2BWEB_DB_USER}
spring.datasource.password=${B2BWEB_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.flyway.enabled=false
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=false
spring.threads.virtual.enabled=true
spring.session.timeout=2h
server.servlet.session.cookie.name=__Host-SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
b2bweb.node-id=${B2BWEB_NODE_ID:0}
logging.level.org.flywaydb=WARN

b2bweb.core.modules.migrate-on-startup=false
b2bweb.core.migration.datasource.username=${B2BWEB_DB_MIGRATION_USER:}
b2bweb.core.migration.datasource.password=${B2BWEB_DB_MIGRATION_PASSWORD:}
spring.data.redis.url=${B2BWEB_REDIS_URL}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.server.port=${B2BWEB_MANAGEMENT_PORT:8081}
management.server.address=${B2BWEB_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,tsidLease
management.endpoint.health.show-details=never
