name: Verify candidate foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/verification/m0-compatibility/requirements.txt
      - run: python tools/verification/m0-compatibility/verify_design.py
      - run: python tools/generators/contracts.py --check
      - run: python tools/generators/catalog.py --check
      - run: python tools/checks/architecture.py
      - run: python tools/checks/migrations.py
      - run: ./mvnw -q verify
      - run: python tools/generators/client.py
      - run: python tools/checks/new_module_exercise.py
      - run: python tools/verification/m0-compatibility/verify_backend.py --cache /tmp/b2b-m0-compat/m2
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/verification/m0-compatibility/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: python tools/frontend/browser.py
      - run: pnpm generate:client && git diff --exit-code -- frontend/packages/api-client/src/schema.d.ts
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python tools/checks/security.py
